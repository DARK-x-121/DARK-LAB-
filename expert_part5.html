<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TEAM DARK – Expert Lab (Part 5)</title>
<style>
body{background:black;color:#00ff66;font-family:monospace;text-align:center}
.box{border:2px solid #00ff66;box-shadow:0 0 15px #00ff66;padding:20px;margin:30px auto;width:95%;max-width:550px}
button{background:black;color:#00ff66;border:2px solid #00ff66;padding:10px;margin:6px;width:95%;cursor:pointer}
button:hover{box-shadow:0 0 10px #00ff66}
.hidden{display:none}
.timer{color:red}
h1{color:red}
</style>
</head>

<body>

<div class="box" id="select">
<h1>TEAM DARK – EXPERT MODE</h1>
<button onclick="start('WiFi')">Wireless Hacking</button>
<button onclick="start('SE')">Social Engineering</button>
<button onclick="start('OSINT')">Recon & OSINT</button>
</div>

<div class="box hidden" id="quiz">
<h2 id="topic"></h2>
<p class="timer">Time: <span id="time">30</span>s</p>
<p id="question"></p>
<div id="options"></div>
</div>

<div class="box hidden" id="result">
<h2 id="user"></h2>
<p id="score"></p>
<p>📸 Screenshot & send to Admin</p>
</div>

<script>
const TIME=30;
let t,i=0,score=0,topicName="",timer;

const Q={
WiFi:[
["WPA2 uses?","AES","DES","MD5","SHA1",0],
["Handshake needed for?","Cracking WiFi","Scanning","Sniffing","Blocking",0],
["Monitor mode is?","Passive capture","Connect mode","Client mode","AP mode",0],
["Evil Twin attack?","Fake AP","Bruteforce","DoS","ARP spoof",0],
["Deauth attack does?","Disconnect users","Encrypt data","Crash router","Patch",0],
["WEP is?","Weak","Strong","Unbreakable","Modern",0],
["802.11 is?","WiFi standard","Bluetooth","NFC","LTE",0],
["Aircrack-ng used for?","WiFi cracking","XSS","SQLi","Forensics",0],
["SSID hidden means?","Name not broadcast","Secure","Encrypted","Disabled",0],
["WPS vulnerable to?","PIN attack","XSS","CSRF","SQLi",0],
["Packet sniffing captures?","Traffic","Passwords only","CPU","RAM",0],
["MAC filtering is?","Weak security","Strong","Firewall","IDS",0],
["Channel hopping helps?","Capture traffic","Encrypt","Hide","Block",0],
["Rogue AP means?","Malicious AP","Secure AP","Router","Client",0],
["Best defense?","Strong encryption","Hide SSID","MAC filter","Low power",0]
],

SE:[
["Social engineering targets?","Humans","Servers","Firewalls","OS",0],
["Phishing is?","Fake communication","Malware","Exploit","Patch",0],
["Pretexting means?","Fake identity","Bruteforce","Scanning","Sniffing",0],
["Baiting uses?","Curiosity","Fear","Patch","Firewall",0],
["Tailgating is?","Physical access","Wireless attack","Exploit","Malware",0],
["Vishing uses?","Phone calls","Email","SMS","USB",0],
["Smishing uses?","SMS","Email","Call","WiFi",0],
["SE success depends on?","Trust","Encryption","Speed","Tools",0],
["Authority principle?","People obey","People ignore","Patch","Encrypt",0],
["Urgency attack?","Create panic","Encrypt","Slow","Block",0],
["Impersonation is?","Pretending","Coding","Sniffing","Scanning",0],
["Best defense?","Awareness","Antivirus","Firewall","IDS",0],
["Dumpster diving gets?","Sensitive info","Passwords only","CPU","RAM",0],
["OSINT aids SE by?","Info gathering","Exploits","Crashes","Encryption",0],
["Human firewall means?","Trained users","IDS","WAF","Antivirus",0]
],

OSINT:[
["OSINT stands for?","Open Source Intelligence","Online System Info","Open Security Index","None",0],
["OSINT data is?","Public","Private","Encrypted","Illegal",0],
["Google dorks help in?","Advanced search","Encryption","Exploits","Scanning",0],
["Shodan scans?","Internet devices","Passwords","Emails","Files",0],
["WHOIS shows?","Domain info","Passwords","Source code","Logs",0],
["Metadata contains?","Hidden info","Malware","Exploits","Backdoors",0],
["Recon phase goal?","Information","Attack","Exploit","Delete",0],
["Passive recon means?","No contact","Direct scan","Bruteforce","DoS",0],
["Active recon means?","Direct interaction","Silent","Offline","Hidden",0],
["Social media useful for?","Profiling","Patching","Encrypting","IDS",0],
["Leak databases give?","Credentials","Firewall","CPU","RAM",0],
["Maltego used for?","Relationship mapping","Cracking","Exploit dev","Forensics",0],
["OSINT legality depends on?","Usage","Tool","Speed","Country only",0],
["Footprinting is?","Initial recon","Exploitation","Post-exploit","Cleanup",0],
["Best OSINT skill?","Correlation","Coding","Bruteforce","Scanning",0]
]
};

function start(tp){
 topicName=tp;i=0;score=0;
 document.getElementById("select").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("topic").innerText=tp;
 load();
}

function load(){
 if(i>=15){end();return;}
 t=TIME; document.getElementById("time").innerText=t;
 const q=Q[topicName][i];
 document.getElementById("question").innerText=(i+1)+". "+q[0];
 const opt=document.getElementById("options"); opt.innerHTML="";
 for(let j=1;j<=4;j++){
  let b=document.createElement("button");
  b.textContent=q[j];
  b.onclick=()=>ans(j-1);
  opt.appendChild(b);
 }
 timer=setInterval(()=>{
  t--; document.getElementById("time").innerText=t;
  if(t<=0){clearInterval(timer);i++;load();}
 },1000);
}

function ans(x){
 clearInterval(timer);
 if(x===Q[topicName][i][5])score++;
 i++; load();
}

function end(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 const n=prompt("Enter your name");
 document.getElementById("user").innerText="Well done, "+n;
 document.getElementById("score").innerText="Score: "+score+" / 15";
}
</script>
</body>
</html>
