<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TEAM DARK – Expert Lab (Part 6)</title>
<style>
body{background:black;color:#00ff66;font-family:monospace;text-align:center}
.box{border:2px solid #00ff66;box-shadow:0 0 15px #00ff66;padding:20px;margin:30px auto;width:95%;max-width:550px}
button{background:black;color:#00ff66;border:2px solid #00ff66;padding:10px;margin:6px;width:95%;cursor:pointer}
button:hover{box-shadow:0 0 10px #00ff66}
.hidden{display:none}
.timer{color:red}
h1{color:red}
</style>
</head>
<body>

<div class="box" id="select">
<h1>TEAM DARK – EXPERT MODE</h1>
<button onclick="start('MSF')">Metasploit Framework</button>
<button onclick="start('BURP')">Burp Suite / Proxy</button>
<button onclick="start('EVADE')">Firewall & IDS Evasion</button>
</div>

<div class="box hidden" id="quiz">
<h2 id="topic"></h2>
<p class="timer">Time: <span id="time">30</span>s</p>
<p id="question"></p>
<div id="options"></div>
</div>

<div class="box hidden" id="result">
<h2 id="user"></h2>
<p id="score"></p>
<p>📸 Screenshot & send to Admin</p>
</div>

<script>
const TIME=30;
let t,i=0,score=0,topicName="",timer;

const Q={
MSF:[
["Metasploit is?","Exploitation framework","Scanner","Firewall","AV",0],
["msfconsole is?","Main interface","Payload","Exploit","Encoder",0],
["Exploit does?","Trigger vuln","Encrypt","Patch","Scan",0],
["Payload is?","Code after exploit","Vuln","Scanner","Fix",0],
["Meterpreter gives?","Interactive shell","AV","Log","Patch",0],
["Auxiliary modules?","Scanning/bruteforce","Payloads","Encoders","Fixes",0],
["Post modules used for?","Post-exploitation","Scanning","Encoding","Patching",0],
["set RHOSTS?","Target IP","Local IP","Gateway","DNS",0],
["set LHOST?","Attacker IP","Victim IP","Gateway","DNS",0],
["Exploit rank means?","Reliability","Speed","Size","Stealth",0],
["msfvenom used for?","Payload gen","Scan","Exploit","Patch",0],
["Handler listens for?","Reverse shells","Updates","Logs","Scans",0],
["Staged payload?","Downloads parts","Single file","Encrypted","Signed",0],
["Unstaged payload?","All-in-one","Split","Encoded","Hidden",0],
["Good practice?","Use only authorized targets","Blind scan","Prod attack","Ignore logs",0]
],
BURP:[
["Burp is a?","Intercepting proxy","Firewall","Scanner only","AV",0],
["Intercept mode does?","Pause requests","Block DNS","Encrypt","Cache",0],
["Repeater used for?","Manual testing","Auto scan","Encoding","Patching",0],
["Intruder used for?","Automation","UI","Logging","Fixing",0],
["Decoder does?","Encode/decode","Exploit","Scan","Patch",0],
["Comparer used to?","Diff responses","Encrypt","Exploit","Scan",0],
["Scope limits?","Target only","Internet","LAN","All traffic",0],
["HTTPS interception needs?","CA cert","Root shell","VPN","Proxy PAC",0],
["Parameter tampering?","Modify params","Encrypt","Patch","Scan",0],
["Session tokens found in?","Cookies/headers","HTML only","CSS","Images",0],
["CSRF testing via?","Request replay","AV","Firewall","DNS",0],
["Proxy benefit?","See/modify traffic","Speed","Encrypt","Block",0],
["Burp Scanner does?","Find vulns","Exploit","Patch","Deploy",0],
["Key skill?","Manual analysis","Blind clicking","Speed","Guessing",0],
["Ethical use?","Permission","Anonymity","Stealth","Force",0]
],
EVADE:[
["Firewall filters?","Traffic","Files","Users","CPU",0],
["IDS detects?","Suspicious activity","Encrypt","Patch","Compile",0],
["IPS does?","Block attacks","Only log","Encrypt","Cache",0],
["Evasion goal?","Bypass detection","Crash IDS","Encrypt DB","Patch",0],
["Packet fragmentation?","Split packets","Encrypt","Compress","Sign",0],
["Encoding payloads?","Avoid signatures","Speed","Size","UI",0],
["Tunneling hides?","Traffic in traffic","Files","Users","CPU",0],
["Protocol switching?","Evade rules","Encrypt","Patch","Log",0],
["Timing attacks?","Slow patterns","Fast flood","Encrypt","Patch",0],
["Polymorphism means?","Changing patterns","Static code","Signed","Fixed",0],
["Obfuscation hides?","Intent","Speed","Size","UI",0],
["WAF protects?","Web apps","Routers","Clients","DNS",0],
["False positives are?","Wrong alerts","Fixes","Patches","Blocks",0],
["Least noisy approach?","Low & slow","Flood","Burst","Spray",0],
["Defense lesson?","Layered security","Single tool","No logs","Blind trust",0]
]
};

function start(tp){
 topicName=tp;i=0;score=0;
 document.getElementById("select").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("topic").innerText=tp;
 load();
}

function load(){
 if(i>=15){end();return;}
 t=TIME; document.getElementById("time").innerText=t;
 const q=Q[topicName][i];
 document.getElementById("question").innerText=(i+1)+". "+q[0];
 const opt=document.getElementById("options"); opt.innerHTML="";
 for(let j=1;j<=4;j++){
  let b=document.createElement("button");
  b.textContent=q[j];
  b.onclick=()=>ans(j-1);
  opt.appendChild(b);
 }
 timer=setInterval(()=>{
  t--; document.getElementById("time").innerText=t;
  if(t<=0){clearInterval(timer);i++;load();}
 },1000);
}

function ans(x){
 clearInterval(timer);
 if(x===Q[topicName][i][5])score++;
 i++; load();
}

function end(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 const n=prompt("Enter your name");
 document.getElementById("user").innerText="Well done, "+n;
 document.getElementById("score").innerText="Score: "+score+" / 15";
}
</script>
</body>
</html>
